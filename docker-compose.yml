version: '3.8'
name: ppc-app

services:
  postgres:
    image: postgres:15
    container_name: ppc-postgres
    environment:
      POSTGRES_DB: ppc_factory
      POSTGRES_USER: ppc_db_user
      POSTGRES_PASSWORD: ppc_db_password
    ports:
      - "5433:5432"
    volumes:
      - ppc-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: ppc-mysql
    environment:
      MYSQL_DATABASE: ppc_analytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ppc-mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ppc-redis
    ports:
      - "6381:6379"
    volumes:
      - ppc-redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ppc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ppc_minio
      MINIO_ROOT_PASSWORD: ppc_minio_secret
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - ppc-minio-data:/data
    restart: unless-stopped

volumes:
  ppc-postgres-data:
  ppc-mysql-data:
  ppc-redis-data:
  ppc-minio-data:
