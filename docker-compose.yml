version: '3.8'
name: pqc-suite

services:
  pqc-pg:
    image: postgres:15
    container_name: pqc-pg-engine
    command: -p 5444
    environment:
      POSTGRES_DB: ppc_factory
      POSTGRES_USER: ppc_db_user
      POSTGRES_PASSWORD: ppc_db_password
    ports:
      - "5444:5444"
    volumes:
      - pqc-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  pqc-my:
    image: mysql:8
    container_name: pqc-my-engine
    command: --port=3344
    environment:
      MYSQL_DATABASE: ppc_analytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3344:3344"
    volumes:
      - pqc-my-data:/var/lib/mysql
    restart: unless-stopped

  pqc-cache:
    image: redis:7-alpine
    container_name: pqc-cache-engine
    command: redis-server --port 6399
    ports:
      - "6399:6399"
    volumes:
      - pqc-cache-data:/data
    restart: unless-stopped

  pqc-storage:
    image: minio/minio:latest
    container_name: pqc-storage-engine
    command: server /data --address ":9110" --console-address ":9111"
    environment:
      MINIO_ROOT_USER: ppc_storage_admin
      MINIO_ROOT_PASSWORD: ppc_storage_secret
    ports:
      - "9110:9110"
      - "9111:9111"
    volumes:
      - pqc-storage-data:/data
    restart: unless-stopped

volumes:
  pqc-pg-data:
  pqc-my-data:
  pqc-cache-data:
  pqc-storage-data:
