version: '3.8'
name: pqc-mes

services:
  postgres:
    image: postgres:15
    container_name: pqc-mes-postgres
    environment:
      POSTGRES_DB: pqc_mes
      POSTGRES_USER: pqc_mes_user
      POSTGRES_PASSWORD: pqc_mes_password
    ports:
      - "5434:5432"
    volumes:
      - pqc-mes-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: pqc-mes-mysql
    environment:
      MYSQL_DATABASE: pqc_mes_analytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - pqc-mes-mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pqc-mes-redis
    ports:
      - "6380:6379"
    volumes:
      - pqc-mes-redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: pqc-mes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pqc_mes_minio
      MINIO_ROOT_PASSWORD: pqc_mes_minio_secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - pqc-mes-minio-data:/data
    restart: unless-stopped

volumes:
  pqc-mes-postgres-data:
  pqc-mes-mysql-data:
  pqc-mes-redis-data:
  pqc-mes-minio-data:
