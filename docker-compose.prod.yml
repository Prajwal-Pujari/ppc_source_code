version: '3.8'
name: pqc-suite

services:
  # ─── PostgreSQL (Main Database) ───
  pqc-pg:
    image: postgres:15
    container_name: pqc-pg-engine
    command: -p 5444
    environment:
      POSTGRES_DB: ppc_factory
      POSTGRES_USER: ppc_db_user
      POSTGRES_PASSWORD: ppc_db_password
    ports:
      - "5444:5444"
    volumes:
      - pqc-pg-data:/var/lib/postgresql/data
    restart: always

  # ─── MySQL (Analytics Database) ───
  pqc-my:
    image: mysql:8
    container_name: pqc-my-engine
    command: --port=3344
    environment:
      MYSQL_DATABASE: ppc_analytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3344:3344"
    volumes:
      - pqc-my-data:/var/lib/mysql
    restart: always

  # ─── Redis (WebSocket & Caching) ───
  pqc-cache:
    image: redis:7-alpine
    container_name: pqc-cache-engine
    command: redis-server --port 6399
    ports:
      - "6399:6399"
    volumes:
      - pqc-cache-data:/data
    restart: always

  # ─── File Storage (MinIO Engine) ───
  pqc-storage:
    image: minio/minio:latest
    container_name: pqc-storage-engine
    command: server /data --address ":9110" --console-address ":9111"
    environment:
      MINIO_ROOT_USER: ppc_storage_admin
      MINIO_ROOT_PASSWORD: ppc_storage_secret
    ports:
      - "9110:9110"
      - "9111:9111"
    volumes:
      - pqc-storage-data:/data
    restart: always

  # ─── Java Backend (Spring Boot) ───
  pqc-core:
    build: ./backend
    container_name: pqc-core-service
    depends_on:
      - pqc-pg
      - pqc-my
      - pqc-cache
      - pqc-storage
    environment:
      # Override application.yml for Docker networking
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:postgresql://pqc-pg:5444/ppc_factory
      SPRING_DATASOURCE_PRIMARY_USERNAME: ppc_db_user
      SPRING_DATASOURCE_PRIMARY_PASSWORD: ppc_db_password
      SPRING_DATASOURCE_SECONDARY_URL: jdbc:mysql://pqc-my:3344/ppc_analytics?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_SECONDARY_USERNAME: root
      SPRING_DATASOURCE_SECONDARY_PASSWORD: root
      SPRING_DATA_REDIS_HOST: pqc-cache
      SPRING_DATA_REDIS_PORT: 6399
      SPRING_FLYWAY_URL: jdbc:postgresql://pqc-pg:5444/ppc_factory
      SPRING_FLYWAY_USER: ppc_db_user
      SPRING_FLYWAY_PASSWORD: ppc_db_password
      MINIO_ENDPOINT: http://pqc-storage:9110
      MINIO_ACCESS_KEY: ppc_storage_admin
      MINIO_SECRET_KEY: ppc_storage_secret
      MES_WEBSOCKET_ALLOWED_ORIGINS: "*"
    restart: always

  # ─── React Frontend (Nginx) ───
  pqc-ui:
    build: ./frontend
    container_name: pqc-ui-service
    depends_on:
      - pqc-core
    ports:
      - "9090:9090"
    restart: always

volumes:
  pqc-pg-data:
  pqc-my-data:
  pqc-cache-data:
  pqc-storage-data:
