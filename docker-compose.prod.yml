version: '3.8'

services:
  # ─── PostgreSQL (Main Database) ───
  postgres:
    image: postgres:15
    container_name: ppc-postgres
    environment:
      POSTGRES_DB: mes_factory
      POSTGRES_USER: mes_db_user
      POSTGRES_PASSWORD: mes_db_password
    volumes:
      - ppc-postgres-data:/var/lib/postgresql/data
    restart: always

  # ─── MySQL (Analytics Database) ───
  mysql:
    image: mysql:8
    container_name: ppc-mysql
    environment:
      MYSQL_DATABASE: mes_analytics
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ppc-mysql-data:/var/lib/mysql
    restart: always

  # ─── Redis (WebSocket & Caching) ───
  redis:
    image: redis:7-alpine
    container_name: ppc-redis
    volumes:
      - ppc-redis-data:/data
    restart: always

  # ─── MinIO (File Storage) ───
  minio:
    image: minio/minio:latest
    container_name: ppc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mes_minio
      MINIO_ROOT_PASSWORD: mes_minio_secret
    volumes:
      - ppc-minio-data:/data
    restart: always

  # ─── Java Backend (Spring Boot) ───
  backend:
    build: ./backend
    container_name: ppc-backend
    depends_on:
      - postgres
      - mysql
      - redis
      - minio
    environment:
      # Override application.yml for Docker networking
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:postgresql://postgres:5432/mes_factory
      SPRING_DATASOURCE_PRIMARY_USERNAME: mes_db_user
      SPRING_DATASOURCE_PRIMARY_PASSWORD: mes_db_password
      SPRING_DATASOURCE_SECONDARY_URL: jdbc:mysql://mysql:3306/mes_analytics?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_SECONDARY_USERNAME: root
      SPRING_DATASOURCE_SECONDARY_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/mes_factory
      SPRING_FLYWAY_USER: mes_db_user
      SPRING_FLYWAY_PASSWORD: mes_db_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: mes_minio
      MINIO_SECRET_KEY: mes_minio_secret
      MES_WEBSOCKET_ALLOWED_ORIGINS: "*"
    restart: always

  # ─── React Frontend (Nginx) ───
  frontend:
    build: ./frontend
    container_name: ppc-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
    restart: always

volumes:
  ppc-postgres-data:
  ppc-mysql-data:
  ppc-redis-data:
  ppc-minio-data:
