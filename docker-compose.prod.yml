version: '3.8'
name: ppc-app

services:
  # ─── PostgreSQL (Main Database) ───
  postgres:
    image: postgres:15
    container_name: ppc-postgres
    command: -p 5444
    environment:
      POSTGRES_DB: ppc_factory
      POSTGRES_USER: ppc_db_user
      POSTGRES_PASSWORD: ppc_db_password
    ports:
      - "5444:5444"
    volumes:
      - ppc-postgres-data:/var/lib/postgresql/data
    restart: always

  # ─── MySQL (Analytics Database) ───
  mysql:
    image: mysql:8
    container_name: ppc-mysql
    command: --port=3344
    environment:
      MYSQL_DATABASE: ppc_analytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3344:3344"
    volumes:
      - ppc-mysql-data:/var/lib/mysql
    restart: always

  # ─── Redis (WebSocket & Caching) ───
  redis:
    image: redis:7-alpine
    container_name: ppc-redis
    command: redis-server --port 6399
    ports:
      - "6399:6399"
    volumes:
      - ppc-redis-data:/data
    restart: always

  # ─── File Storage (MinIO Engine) ───
  filestore:
    image: minio/minio:latest
    container_name: ppc-filestore
    command: server /data --address ":9110" --console-address ":9111"
    environment:
      MINIO_ROOT_USER: ppc_storage_admin
      MINIO_ROOT_PASSWORD: ppc_storage_secret
    ports:
      - "9110:9110"
      - "9111:9111"
    volumes:
      - ppc-filestore-data:/data
    restart: always

  # ─── Java Backend (Spring Boot) ───
  backend:
    build: ./backend
    container_name: ppc-backend
    depends_on:
      - postgres
      - mysql
      - redis
      - filestore
    environment:
      # Override application.yml for Docker networking
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:postgresql://postgres:5444/ppc_factory
      SPRING_DATASOURCE_PRIMARY_USERNAME: ppc_db_user
      SPRING_DATASOURCE_PRIMARY_PASSWORD: ppc_db_password
      SPRING_DATASOURCE_SECONDARY_URL: jdbc:mysql://mysql:3344/ppc_analytics?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_SECONDARY_USERNAME: root
      SPRING_DATASOURCE_SECONDARY_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6399
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5444/ppc_factory
      SPRING_FLYWAY_USER: ppc_db_user
      SPRING_FLYWAY_PASSWORD: ppc_db_password
      MINIO_ENDPOINT: http://filestore:9110
      MINIO_ACCESS_KEY: ppc_storage_admin
      MINIO_SECRET_KEY: ppc_storage_secret
      MES_WEBSOCKET_ALLOWED_ORIGINS: "*"
    restart: always

  # ─── React Frontend (Nginx) ───
  frontend:
    build: ./frontend
    container_name: ppc-frontend
    depends_on:
      - backend
    ports:
      - "9090:9090"
    restart: always

volumes:
  ppc-postgres-data:
  ppc-mysql-data:
  ppc-redis-data:
  ppc-filestore-data:
