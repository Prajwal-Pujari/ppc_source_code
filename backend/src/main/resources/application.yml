server:
  port: 8080

spring:
  application:
    name: mes-factory

  datasource:
    primary:
      url: jdbc:postgresql://localhost:5433/mes_factory
      username: mes_db_user
      password: mes_db_password
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
        show-sql: false
    secondary:
      url: jdbc:mysql://localhost:3307/mes_analytics?useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 3
        connection-timeout: 30000
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        ddl-auto: update
        show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    user: mes_db_user
    password: mes_db_password
    url: jdbc:postgresql://localhost:5433/mes_factory

jwt:
  secret: Y2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZQ==
  access-token-expiration-ms: 86400000
  refresh-token-expiration-ms: 31536000000

minio:
  endpoint: http://localhost:9000
  access-key: mes_minio
  secret-key: mes_minio_secret
  bucket-name: mes-factory

mes:
  websocket:
    allowed-origins: http://localhost:5173
