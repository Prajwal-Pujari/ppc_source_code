server:
  port: 9091

spring:
  application:
    name: ppc-factory

  datasource:
    primary:
      url: jdbc:postgresql://localhost:5444/ppc_factory
      username: ppc_db_user
      password: ppc_db_password
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
        show-sql: false
    secondary:
      url: jdbc:mysql://localhost:3344/ppc_analytics?useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 3
        connection-timeout: 30000
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        ddl-auto: update
        show-sql: false

  data:
    redis:
      host: localhost
      port: 6399

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true
    ignore-migration-patterns: "*:missing,*:modified,*:future"
    validate-on-migrate: false
    user: ppc_db_user
    password: ppc_db_password
    url: jdbc:postgresql://localhost:5444/ppc_factory

jwt:
  secret: Y2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZQ==
  access-token-expiration-ms: 86400000
  refresh-token-expiration-ms: 31536000000

minio:
  endpoint: http://localhost:9110
  access-key: ppc_minio
  secret-key: ppc_minio_secret
  bucket-name: ppc-factory

mes:
  websocket:
    allowed-origins: http://localhost:9090,http://localhost:5173
